<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Chaos Ledger</title>
<style>
  :root {
    --bg: #14110d;
    --panel: #1d1812;
    --panel-hover: #251f17;
    --border: #35291b;
    --gold: #c8933c;
    --gold-dim: #8a6a34;
    --up: #7fa87f;
    --down: #b9614f;
    --text: #e8dfce;
    --text-dim: #8c8272;
    --font-display: Georgia, 'Iowan Old Style', serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    padding: 16px;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--gold);
    margin: 0 0 2px 0;
  }
  header p.tag {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 16px 0;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  select, input[type="text"], button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  input[type="text"] { flex: 1; min-width: 120px; }
  button {
    color: var(--gold);
    cursor: pointer;
    border-color: var(--gold-dim);
  }
  button:hover { background: var(--panel-hover); }
  button.toggle-active {
    background: var(--gold-dim);
    color: var(--bg);
  }
  #status {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
    min-height: 16px;
  }
  #status.err { color: var(--down); }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  .row:hover { background: var(--panel); }
  .row img {
    width: 28px;
    height: 28px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .row .name {
    flex: 1;
    min-width: 0;
    font-family: var(--font-display);
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .value {
    font-size: 14px;
    color: var(--gold);
    min-width: 90px;
    text-align: right;
  }
  .row .change {
    font-size: 12px;
    min-width: 60px;
    text-align: right;
  }
  .row .change.up { color: var(--up); }
  .row .change.down { color: var(--down); }
  .row .change.flat { color: var(--text-dim); }
  .star {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    color: var(--border);
  }
  .star.starred { color: var(--gold); }
  footer {
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Chaos Ledger</h1>
    <p class="tag">Live currency prices, sourced from poe.ninja</p>
  </header>

  <div class="toolbar">
    <select id="leagueSelect"><option>Loading leagues...</option></select>
    <button id="refreshBtn">Refresh</button>
    <button id="starredBtn">★ Starred only</button>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Filter currencies...">
  </div>

  <div id="status">Starting up...</div>
  <div id="list"></div>

  <footer>Data from poe.ninja's public economy API. Prices cache for a few minutes on their end, so don't expect second-by-second updates.</footer>
</div>

<script>
const STORAGE_KEY = 'chaos-ledger-starred';
const LEGACY_URL = 'https://poe.ninja/api/data/currencyoverview';
const NEW_LEAGUES_URL = 'https://poe.ninja/poe1/api/economy/leagues';
const NEW_CURRENCY_URL = 'https://poe.ninja/poe1/api/economy/stash/current/currency/overview';
// Tried in order. If one proxy is down or misconfigured, we fall through
// to the next rather than failing outright.
const PROXIES = [
  (url) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
  (url) => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
  (url) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
];

let starred = new Set();
let currentLines = [];
let showStarredOnly = false;

function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

async function fetchJSON(url) {
  // Try direct first. poe.ninja doesn't send CORS headers for browser JS,
  // so this is expected to fail and we fall through to a proxy.
  const errors = [];
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (directErr) {
    errors.push('direct: ' + directErr.message);
  }
  for (const buildProxyUrl of PROXIES) {
    try {
      const res = await fetch(buildProxyUrl(url));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (proxyErr) {
      errors.push('proxy: ' + proxyErr.message);
    }
  }
  throw new Error(errors.join(' | '));
}

async function loadStarred() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    if (result && result.value) {
      starred = new Set(JSON.parse(result.value));
    }
  } catch (e) {
    // no starred items saved yet, that's fine
  }
}

async function saveStarred() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify([...starred]), false);
  } catch (e) {
    console.error('Could not save starred list', e);
  }
}

async function loadLeagues() {
  const select = document.getElementById('leagueSelect');
  try {
    const leagues = await fetchJSON(NEW_LEAGUES_URL);
    select.innerHTML = '';
    leagues.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = l.name || l.id;
      select.appendChild(opt);
    });
    return leagues.length ? leagues[0].id : 'Standard';
  } catch (e) {
    setStatus('Could not load league list automatically (' + e.message + '). Defaulting to Standard, pick another league manually if needed.', true);
    select.innerHTML = '<option value="Standard">Standard</option><option value="Hardcore">Hardcore</option>';
    return 'Standard';
  }
}

function computeChange(sparkline) {
  if (!sparkline || !sparkline.data) return null;
  const points = sparkline.data.filter(v => v !== null && v !== undefined);
  if (points.length < 2) return null;
  const first = points[0];
  const last = points[points.length - 1];
  if (!first) return null;
  return ((last - first) / first) * 100;
}

function normalizeLegacy(data) {
  return (data.lines || []).map(line => ({
    id: line.currencyTypeName,
    name: line.currencyTypeName,
    value: line.chaosEquivalent,
    unit: 'chaos',
    changePct: computeChange(line.receiveSparkLine),
    icon: (data.currencyDetails || []).find(d => d.name === line.currencyTypeName)?.icon || ''
  }));
}

function normalizeNew(data) {
  const primary = data.core ? data.core.primary : '';
  const items = data.core ? data.core.items : {};
  return (data.lines || []).map(line => ({
    id: line.id,
    name: (items[line.id] && items[line.id].name) || line.id,
    value: line.primaryValue,
    unit: primary,
    changePct: computeChange(line.sparkline),
    icon: (items[line.id] && items[line.id].icon) || ''
  }));
}

async function loadCurrency(league) {
  setStatus('Fetching prices for ' + league + '...');
  // Try the current documented endpoint first, fall back to the older
  // long-standing endpoint if the new one errors or returns nothing usable.
  try {
    const data = await fetchJSON(NEW_CURRENCY_URL + '?league=' + encodeURIComponent(league) + '&type=Currency');
    if (data && data.lines && data.lines.length) {
      currentLines = normalizeLegacy(data); // this endpoint's shape matches the legacy CurrencyOverviewLineModel
      setStatus('Loaded ' + currentLines.length + ' currencies for ' + league + '. Last updated ' + new Date().toLocaleTimeString());
      render();
      return;
    }
    throw new Error('empty response');
  } catch (e1) {
    try {
      const data2 = await fetchJSON(LEGACY_URL + '?league=' + encodeURIComponent(league) + '&type=Currency');
      currentLines = normalizeLegacy(data2);
      setStatus('Loaded ' + currentLines.length + ' currencies for ' + league + ' via legacy endpoint. Last updated ' + new Date().toLocaleTimeString());
      render();
    } catch (e2) {
      setStatus('Both endpoints failed. New: ' + e1.message + ' | Legacy: ' + e2.message, true);
      document.getElementById('list').innerHTML = '';
    }
  }
}

function render() {
  const list = document.getElementById('list');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let rows = currentLines.filter(l => l.name.toLowerCase().includes(query));
  if (showStarredOnly) rows = rows.filter(l => starred.has(l.id));
  rows.sort((a, b) => (b.value || 0) - (a.value || 0));

  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">No currencies match.</p>';
    return;
  }
  rows.forEach(l => {
    const row = document.createElement('div');
    row.className = 'row';

    const star = document.createElement('button');
    star.className = 'star' + (starred.has(l.id) ? ' starred' : '');
    star.textContent = starred.has(l.id) ? '★' : '☆';
    star.onclick = () => {
      if (starred.has(l.id)) starred.delete(l.id); else starred.add(l.id);
      saveStarred();
      render();
    };

    const img = document.createElement('img');
    if (l.icon) img.src = l.icon;

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = l.name;

    const value = document.createElement('div');
    value.className = 'value';
    value.textContent = l.value ? l.value.toFixed(1) + ' c' : '-';

    const change = document.createElement('div');
    if (l.changePct === null || l.changePct === undefined) {
      change.className = 'change flat';
      change.textContent = '—';
    } else {
      const pct = l.changePct;
      change.className = 'change ' + (pct > 1 ? 'up' : pct < -1 ? 'down' : 'flat');
      change.textContent = (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
    }

    row.appendChild(star);
    row.appendChild(img);
    row.appendChild(name);
    row.appendChild(value);
    row.appendChild(change);
    list.appendChild(row);
  });
}

async function init() {
  await loadStarred();
  const defaultLeague = await loadLeagues();
  document.getElementById('leagueSelect').value = defaultLeague;
  await loadCurrency(defaultLeague);

  document.getElementById('refreshBtn').onclick = () => loadCurrency(document.getElementById('leagueSelect').value);
  document.getElementById('leagueSelect').onchange = (e) => loadCurrency(e.target.value);
  document.getElementById('searchInput').oninput = render;
  document.getElementById('starredBtn').onclick = (e) => {
    showStarredOnly = !showStarredOnly;
    e.target.classList.toggle('toggle-active', showStarredOnly);
    render();
  };
}

init();
</script>
</body>
</html>
