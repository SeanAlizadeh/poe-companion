<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Chaos Ledger</title>
<style>
  :root {
    --bg: #14110d;
    --panel: #1d1812;
    --panel-hover: #251f17;
    --border: #35291b;
    --gold: #c8933c;
    --gold-dim: #8a6a34;
    --up: #7fa87f;
    --down: #b9614f;
    --text: #e8dfce;
    --text-dim: #8c8272;
    --font-display: Georgia, 'Iowan Old Style', serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    padding: 16px;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--gold);
    margin: 0 0 2px 0;
  }
  header p.tag {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 16px 0;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"], button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  input[type="text"] { flex: 1; min-width: 120px; }
  button {
    color: var(--gold);
    cursor: pointer;
    border-color: var(--gold-dim);
  }
  button:hover { background: var(--panel-hover); }
  button.toggle-active {
    background: var(--gold-dim);
    color: var(--bg);
  }
  #status {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
    min-height: 16px;
  }
  #status.err { color: var(--down); }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  .row:hover { background: var(--panel); }
  .row img {
    width: 28px;
    height: 28px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .row .name {
    flex: 1;
    min-width: 0;
    font-family: var(--font-display);
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .value {
    font-size: 14px;
    color: var(--gold);
    min-width: 90px;
    text-align: right;
  }
  .row .change {
    font-size: 12px;
    min-width: 60px;
    text-align: right;
  }
  .row .change.up { color: var(--up); }
  .row .change.down { color: var(--down); }
  .row .change.flat { color: var(--text-dim); }
  .star {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    color: var(--border);
  }
  .star.starred { color: var(--gold); }
  footer {
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Chaos Ledger</h1>
    <p class="tag">Currency prices for <span id="leagueName">…</span>, sourced from poe.ninja</p>
  </header>

  <div class="toolbar">
    <button id="refreshBtn">Refresh</button>
    <button id="starredBtn">★ Starred only</button>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Filter currencies...">
  </div>

  <div id="status">Starting up...</div>
  <div id="list"></div>

  <footer>Prices are fetched by a scheduled job and committed to this site, not called live from your browser. Data updates roughly every 30 minutes.</footer>
</div>

<script>
const STORAGE_KEY = 'chaos-ledger-starred';
const DATA_URL = './data/currency.json';

let starred = new Set();
let currentLines = [];
let showStarredOnly = false;

function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

async function loadStarred() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    if (result && result.value) {
      starred = new Set(JSON.parse(result.value));
    }
  } catch (e) {
    // no starred items saved yet, that's fine
  }
}

async function saveStarred() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify([...starred]), false);
  } catch (e) {
    console.error('Could not save starred list', e);
  }
}

async function loadCurrency() {
  setStatus('Loading prices...');
  try {
    // Cache-bust so we don't get stuck on a stale copy from the browser cache.
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    currentLines = data.lines || [];
    document.getElementById('leagueName').textContent = (data.league && data.league.name) || 'unknown league';
    const fetchedAt = data.fetchedAt ? new Date(data.fetchedAt).toLocaleString() : 'unknown time';
    setStatus('Loaded ' + currentLines.length + ' currencies (' + (data.source || 'unknown') + ' market). Data snapshot from ' + fetchedAt);
    render();
  } catch (e) {
    setStatus('Could not load data/currency.json (' + e.message + '). If this is the first deploy, the update workflow may not have run yet, check the Actions tab.', true);
  }
}

function render() {
  const list = document.getElementById('list');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let rows = currentLines.filter(l => l.name.toLowerCase().includes(query));
  if (showStarredOnly) rows = rows.filter(l => starred.has(l.id));
  rows.sort((a, b) => (b.value || 0) - (a.value || 0));

  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">No currencies match.</p>';
    return;
  }
  rows.forEach(l => {
    const row = document.createElement('div');
    row.className = 'row';

    const star = document.createElement('button');
    star.className = 'star' + (starred.has(l.id) ? ' starred' : '');
    star.textContent = starred.has(l.id) ? '★' : '☆';
    star.onclick = () => {
      if (starred.has(l.id)) starred.delete(l.id); else starred.add(l.id);
      saveStarred();
      render();
    };

    const img = document.createElement('img');
    if (l.icon) img.src = l.icon;

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = l.name;

    const value = document.createElement('div');
    value.className = 'value';
    const unitLabel = (l.unit === 'chaos' || !l.unit) ? 'c' : l.unit;
    value.textContent = l.value ? l.value.toFixed(1) + ' ' + unitLabel : '-';

    const change = document.createElement('div');
    if (l.changePct === null || l.changePct === undefined) {
      change.className = 'change flat';
      change.textContent = '—';
    } else {
      const pct = l.changePct;
      change.className = 'change ' + (pct > 1 ? 'up' : pct < -1 ? 'down' : 'flat');
      change.textContent = (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
    }

    row.appendChild(star);
    row.appendChild(img);
    row.appendChild(name);
    row.appendChild(value);
    row.appendChild(change);
    list.appendChild(row);
  });
}

async function init() {
  await loadStarred();
  await loadCurrency();

  document.getElementById('refreshBtn').onclick = loadCurrency;
  document.getElementById('searchInput').oninput = render;
  document.getElementById('starredBtn').onclick = (e) => {
    showStarredOnly = !showStarredOnly;
    e.target.classList.toggle('toggle-active', showStarredOnly);
    render();
  };
}

init();
</script>
</body>
</html>
